services:
  jukebox:
    # image + build together: `docker compose build` (local dev/testing)
    # builds and tags this image locally; on the deployment server, `docker
    # compose pull` grabs the pre-built image from GHCR instead (see
    # .github/workflows/docker-publish.yml) - no source checkout or build
    # toolchain needed there, just this file and backend/.env.
    image: ghcr.io/swivelingtoast/kids-tunes:latest
    build: .
    ports:
      - '3001:3001'
    volumes:
      - jukebox-data:/app/backend/data
    env_file:
      # Reuses the same file as local dev for the Spotify credentials -
      # FRONTEND_URL/DB_PATH below deliberately override that file's
      # dev-oriented values for the containerized, single-origin setup.
      - ./backend/.env
    environment:
      - FRONTEND_URL=http://127.0.0.1:3001
      - DB_PATH=/app/backend/data/jukebox.db
    restart: unless-stopped

volumes:
  jukebox-data:
